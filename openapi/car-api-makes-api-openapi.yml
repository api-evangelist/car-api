      - $ref: '#/x-swagger-bake/components/parameters/paginatorDirection'
      - in: query
        name: make
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: year
        required: false
        schema:
          type: string
          description: Value
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                    type: array
                allOf:
                - $ref: '#/x-swagger-bake/components/schemas/Generic-Collection'
        '400':
          description: BadRequestException
          content:
            application/json:
              schema:
                title: BadRequestException
                properties:
                  exception:
                    example: BadRequestException
                    type: string
                  code:
                    example: 400
                    type: string
                  url:
