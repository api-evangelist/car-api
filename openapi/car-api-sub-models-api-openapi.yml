openapi: 3.2.0
info:
  version: 2.3.15
  title: Car API Documentation Sub Models API
  description: 'Welcome to CarAPIs vehicle API documentation. The developer friendly Car API.

    Start developing with your vehicle API today — no fees, no signup. CarAPIs free vehicle data-set

    requires no account. Only pay when you''re ready to go live. The free data-set is limited to 2015-2020 vehicles.

    To access the full data-set you may signup here and then select a subscription plan.


    **Additional Documentation**


    For additional documentation please review https://carapi.app/docs.


    **SDKs**


    PHP SDK: https://github.com/car-api-team/carapi-php-sdk


    **Release Updates**


    Check release history here: https://github.com/car-api-team/docs/releases'
servers:
- url: https://carapi.app
tags:
- name: Sub Models
paths:
  /api/submodels/v2:
    get:
      operationId: oemmakemodelsubmodels:index:get
      summary: Get Sub Models for light duty cars, trucks, vans and SUVs
      description: 'The demo dataset contains sub-models sold between years 2015 - 2020. To access years 1900 - today please purchase

        a Plus or Premium subscription. You must include a valid JWT in the header once you have

        purchased a subscription otherwise you will continue to receive the demo dataset.


        For complex queries you may use the json field to send an array of URL encoded JSON conditions, example:


        `[{"field": "make", "op": "in", "val": ["Ford", "Acura"]}, {"field": "year", "op": ">=", "val": 2010}]`


        JSON operators: `=`, `!=`, `>`, `=`, `<=`, `in`, `not in`, `like`, `not like`, `not null`, and `is null`.


        JSON search fields:

        `year`, `make`, `model`, `submodel`, `oem_make_model_id`, `oem_make_model_submodel_id`, `created`, `modified`, and `make_id`.'
      tags:
      - Sub Models
      parameters:
      - $ref: '#/x-swagger-bake/components/parameters/paginatorPage'
      - $ref: '#/x-swagger-bake/components/parameters/paginatorLimit'
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - OemMakeModelSubmodels.year
          - Makes.name
          - OemMakeModels.name
          - OemMakeModelSubmodels.name
      - $ref: '#/x-swagger-bake/components/parameters/paginatorDirection'
      - in: query
        name: year
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: make
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: model
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: submodel
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: oem_make_model_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: make_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: json
        required: false
        schema:
          type: string
          description: OemJsonSearchFilter
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      type: object
                      allOf:
                      - $ref: '#/components/schemas/OemMakeModelSubmodel'
                    type: array
                allOf:
                - $ref: '#/x-swagger-bake/components/schemas/Generic-Collection'
        '400':
          description: BadRequestException
          content:
            application/json:
              schema:
                title: BadRequestException
                properties:
                  exception:
                    example: BadRequestException
                    type: string
                  code:
                    example: 400
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The request contains invalid data. The returned error message should indicate the issue.
                    type: string
        '405':
          description: MethodNotAllowedException
          content:
            application/json:
              schema:
                title: MethodNotAllowedException
                properties:
                  exception:
                    example: MethodNotAllowedException
                    type: string
                  code:
                    example: 405
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The HTTP method used to request this resource is not valid. For example, using an HTTP POST  when the endpoint only accepts HTTP GET.
                    type: string
        '429':
          description: 'TooManyRequestsException - Max Per Minute: 600'
          content:
            application/json:
              schema:
                title: TooManyRequestsException
                properties:
                  exception:
                    example: TooManyRequestsException
                    type: string
                  code:
                    example: 429
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: 'TooManyRequestsException - Max Per Minute: 600 (note: daily rate limits may apply, see your subscription plans details)'
                    type: string
        '503':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                title: ServiceUnavailableException
                properties:
                  exception:
                    example: ServiceUnavailableException
                    type: string
                  code:
                    example: 503
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The server is unavailable, typically only encountered during scheduled maintenance.
                    type: string
      security:
      - bearerAuth: []
components:
  schemas:
    OemMakeModelSubmodel:
      properties:
        id:
          minLength: 1
          type: integer
          format: int64
          readOnly: true
        oem_make_model_id:
          minLength: 1
          type: integer
          format: int64
        year:
          maximum: 2027
          minLength: 1
          type: integer
          format: int64
          description: Vehicle Year
          exclusiveMinimum: 1890
        make:
          example: <string> Make (i.e. Ford, etc.)
          type: string
          description: Vehicle make/brand
        model:
          example: <string> Model (i.e. Ford > F-150, etc.)
          type: string
          description: Vehicle model
        submodel:
          example: <string> Submodel (i.e. Ford > F-150 > King Ranch)
          type: string
          description: Vehicle Submodel
      type: object
      description: ''
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
