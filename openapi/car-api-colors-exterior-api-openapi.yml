openapi: 3.2.0
info:
  version: 2.3.15
  title: Car API Documentation Colors (Exterior) API
  description: 'Welcome to CarAPIs vehicle API documentation. The developer friendly Car API.

    Start developing with your vehicle API today — no fees, no signup. CarAPIs free vehicle data-set

    requires no account. Only pay when you''re ready to go live. The free data-set is limited to 2015-2020 vehicles.

    To access the full data-set you may signup here and then select a subscription plan.


    **Additional Documentation**


    For additional documentation please review https://carapi.app/docs.


    **SDKs**


    PHP SDK: https://github.com/car-api-team/carapi-php-sdk


    **Release Updates**


    Check release history here: https://github.com/car-api-team/docs/releases'
servers:
- url: https://carapi.app
tags:
- name: Colors (Exterior)
paths:
  /api/exterior-colors:
    get:
      operationId: makemodeltrimexteriorcolors:index:get
      summary: Search vehicle exterior colors (use /api/exterior-colors/v2 instead)
      description: '**We encourage users to begin migrating to /api/exterior-colors/v2**


        To include additional information about the returned body (such as year, make, model and trim) request with the

        query parameter as `verbose=yes`.


        For complex queries you may use the json field to send an array of URL encoded JSON conditions, example:


        `[{"field": "name", "op": "in", "val": ["red", "blue"]}]`


        JSON operators: `=`, `!=`, `>`, `=`, `<=`, `in`, `not in`, `like`, `not like`, `not null`, and `is null`.


        JSON search fields:

        `year`, `make`, `model`, `trim`, `name`, `rgb`, `created`, `modified`, `make_id`, `make_model_id`, and `make_model_trim_id`.'
      tags:
      - Colors (Exterior)
      externalDocs:
        url: https://carapi.app/features/json-api-specs#colors
        description: Documentation
      parameters:
      - $ref: '#/x-swagger-bake/components/parameters/paginatorPage'
      - $ref: '#/x-swagger-bake/components/parameters/paginatorLimit'
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - id
          - make_model_trim_id
          - name
          - rgb
      - $ref: '#/x-swagger-bake/components/parameters/paginatorDirection'
      - in: query
        name: verbose
        description: Includes make, model and trim
        required: false
        schema:
          type: string
          enum:
          - 'yes'
          - 'no'
      - in: query
        name: make_model_trim_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: make_model_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: make_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: name
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: rgb
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: year
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: make
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: model
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: trim
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: json
        required: false
        schema:
          type: string
          description: JsonSearchFilter
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      type: object
                      allOf:
                      - $ref: '#/components/schemas/MakeModelTrimExteriorColor'
                    type: array
                allOf:
                - $ref: '#/x-swagger-bake/components/schemas/Generic-Collection'
        '400':
          description: BadRequestException
          content:
            application/json:
              schema:
                title: BadRequestException
                properties:
                  exception:
                    example: BadRequestException
                    type: string
                  code:
                    example: 400
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The request contains invalid data. The returned error message should indicate the issue.
                    type: string
        '405':
          description: MethodNotAllowedException
          content:
            application/json:
              schema:
                title: MethodNotAllowedException
                properties:
                  exception:
                    example: MethodNotAllowedException
                    type: string
                  code:
                    example: 405
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The HTTP method used to request this resource is not valid. For example, using an HTTP POST  when the endpoint only accepts HTTP GET.
                    type: string
        '429':
          description: 'TooManyRequestsException - Max Per Minute: 600'
          content:
            application/json:
              schema:
                title: TooManyRequestsException
                properties:
                  exception:
                    example: TooManyRequestsException
                    type: string
                  code:
                    example: 429
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: 'TooManyRequestsException - Max Per Minute: 600 (note: daily rate limits may apply, see your subscription plans details)'
                    type: string
        '503':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                title: ServiceUnavailableException
                properties:
                  exception:
                    example: ServiceUnavailableException
                    type: string
                  code:
                    example: 503
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The server is unavailable, typically only encountered during scheduled maintenance.
                    type: string
      security:
      - bearerAuth: []
      deprecated: true
  /api/exterior-colors/v2:
    get:
      operationId: makemodeltrimexteriorcolors:index2:get
      summary: Search vehicle exterior colors
      description: 'The demo dataset contains model years 2015 - 2020. To access years 1900 - today please purchase

        a Premium Subscription. You must include a valid JWT in the header once you have

        purchased a subscription otherwise you will continue to receive the demo dataset.


        For complex queries you may use the json field to send an array of URL encoded JSON conditions, example:


        `[{"field": "color", "op": "in", "val": ["red", "blue"]}]`


        JSON operators: `=`, `!=`, `>`, `=`, `<=`, `in`, `not in`, `like`, `not like`, `not null`, and `is null`.


        JSON search fields:

        `year`, `make`, `model`, `series`, `submodel`, `trim`, `description`, `make_id`, `model_id`, `submodel_id`, `trim_id`, `color`, `rgb`, `modified`, and `created`.'
      tags:
      - Colors (Exterior)
      externalDocs:
        url: https://carapi.app/features/json-api-specs#colors
        description: Documentation
      parameters:
      - $ref: '#/x-swagger-bake/components/parameters/paginatorPage'
      - $ref: '#/x-swagger-bake/components/parameters/paginatorLimit'
      - $ref: '#/x-swagger-bake/components/parameters/paginatorSort'
      - $ref: '#/x-swagger-bake/components/parameters/paginatorDirection'
      - in: query
        name: year
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: make
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: model
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: series
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: submodel
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: trim
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: description
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: make_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: model_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: submodel_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: trim_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: color
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: rgb
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: json
        required: false
        schema:
          type: string
          description: JsonSearchFilter
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        make_id:
                          type: integer
                        model_id:
                          type: integer
                        submodel_id:
                          type: integer
                        trim_id:
                          type: integer
                        year:
                          type: integer
                        make:
                          type: string
                        model:
                          type: string
                        series:
                          type:
                          - string
                          - 'null'
                        submodel:
                          type: string
                        trim:
                          type: string
                        trim_description:
                          type: string
                        color:
                          type: string
                        rgb:
                          type: string
                    type: array
                allOf:
                - $ref: '#/x-swagger-bake/components/schemas/Generic-Collection'
        '400':
          description: BadRequestException
          content:
            application/json:
              schema:
                title: BadRequestException
                properties:
                  exception:
                    example: BadRequestException
                    type: string
                  code:
                    example: 400
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The request contains invalid data. The returned error message should indicate the issue.
                    type: string
        '405':
          description: MethodNotAllowedException
          content:
            application/json:
              schema:
                title: MethodNotAllowedException
                properties:
                  exception:
                    example: MethodNotAllowedException
                    type: string
                  code:
                    example: 405
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The HTTP method used to request this resource is not valid. For example, using an HTTP POST  when the endpoint only accepts HTTP GET.
                    type: string
        '429':
          description: 'TooManyRequestsException - Max Per Minute: 600'
          content:
            application/json:
              schema:
                title: TooManyRequestsException
                properties:
                  exception:
                    example: TooManyRequestsException
                    type: string
                  code:
                    example: 429
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: 'TooManyRequestsException - Max Per Minute: 600 (note: daily rate limits may apply, see your subscription plans details)'
                    type: string
        '503':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                title: ServiceUnavailableException
                properties:
                  exception:
                    example: ServiceUnavailableException
                    type: string
                  code:
                    example: 503
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The server is unavailable, typically only encountered during scheduled maintenance.
                    type: string
      security:
      - bearerAuth: []
components:
  schemas:
    MakeModelTrimExteriorColor:
      properties:
        id:
          minLength: 1
          type: integer
          format: int64
          readOnly: true
        make_model_trim_id:
          minLength: 1
          type: integer
          format: int64
        name:
          minLength: 1
          maxLength: 128
          type: string
          description: Color and shade
        rgb:
          maxLength: 16
          type: string
          description: Red, Green, Blue (RGB) value
      type: object
      description: ''
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
