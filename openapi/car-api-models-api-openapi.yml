        `[{"field": "make", "op": "in", "val": ["Kawasaki", "Harley Davidson"]}, {"field": "year", "op": ">=", "val": 2010}]`


        JSON operators: `=`, `!=`, `>`, `=`, `<=`, `in`, `not in`, `like`, `not like`, `not null`, and `is null`.


        JSON search fields:

        `year`, `make`, `model`, `make_id`, `created`, and `modified`.'
