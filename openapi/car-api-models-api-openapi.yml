      - $ref: '#/x-swagger-bake/components/parameters/paginatorLimit'
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - OemMakeModels.name
          - Makes.name
      - $ref: '#/x-swagger-bake/components/parameters/paginatorDirection'
      - in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - street_motorcycle
      - in: query
        name: year
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: make
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: model
        required: false
        schema:
          type: string
          description: Like
      - in: query
        name: make_id
        required: false
        schema:
          type: string
          description: Value
      - in: query
        name: json
        required: false
        schema:
          type: string
          description: OemJsonSearchFilter
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
