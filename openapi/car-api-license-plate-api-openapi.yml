openapi: 3.2.0
info:
  version: 2.3.15
  title: Car API Documentation License Plate API
  description: 'Welcome to CarAPIs vehicle API documentation. The developer friendly Car API.

    Start developing with your vehicle API today — no fees, no signup. CarAPIs free vehicle data-set

    requires no account. Only pay when you''re ready to go live. The free data-set is limited to 2015-2020 vehicles.

    To access the full data-set you may signup here and then select a subscription plan.


    **Additional Documentation**


    For additional documentation please review https://carapi.app/docs.


    **SDKs**


    PHP SDK: https://github.com/car-api-team/carapi-php-sdk


    **Release Updates**


    Check release history here: https://github.com/car-api-team/docs/releases'
servers:
- url: https://carapi.app
tags:
- name: License Plate
paths:
  /api/license-plate:
    get:
      operationId: licenseplate:index:get
      summary: License Plate Lookup
      description: 'Returns information about the vehicle and the Vehicle Identification Number (VIN) associated to the license

        plate. Data requirements around the region parameter differ based on the country_code you are requesting data

        for. Refer to https://carapi.app/docs/ for additional documentation. Each country makes available different data

        so depending on the country requested some values may be returned as null.


        For testing, any lookup containing the string "_TEST" will return test data. Example:


        - United States: `/api/license-plate?country_code=US®ion=NY&lookup=830UNL_TEST`

        - Canada: `/api/license-plate?country_code=CA®ion=BC&lookup=_TEST`

        - United Kingdom: `/api/license-plate?country_code=UK&lookup=_TEST-LD59YMR`


        The following countries are currently supported: US, CA, AU, UK, FR, IE, NZ, MX, CZ and PT'
      tags:
      - License Plate
      externalDocs:
        url: https://carapi.app/docs/
        description: ''
      parameters:
      - in: query
        name: country_code
        description: ISO 3166-1 alpha-2 country code (two letters)
        required: true
        schema:
          type: string
      - in: query
        name: lookup
        description: The license plate (registration in some countries) to lookup
        required: true
        schema:
          type: string
      - in: query
        name: region
        description: Province, region or state (required for US, CA and AU)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  year:
                    type:
                    - integer
                    - 'null'
                    description: Returned for all countries except for Germany
                  make:
                    type: string
                  model:
                    type: string
                  body:
                    type:
                    - string
                    - 'null'
                  vin:
                    type:
                    - string
                    - 'null'
                    description: Returned for all countries except for Ireland
                  engine_description:
                    type:
                    - string
                    - 'null'
                  assembled_in:
                    type:
                    - string
                    - 'null'
                type: object
        '404':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        '400':
          description: BadRequestException
          content:
            application/json:
              schema:
                title: BadRequestException
                properties:
                  exception:
                    example: BadRequestException
                    type: string
                  code:
                    example: 400
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The request contains invalid data. The returned error message should indicate the issue.
                    type: string
        '405':
          description: MethodNotAllowedException
          content:
            application/json:
              schema:
                title: MethodNotAllowedException
                properties:
                  exception:
                    example: MethodNotAllowedException
                    type: string
                  code:
                    example: 405
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The HTTP method used to request this resource is not valid. For example, using an HTTP POST  when the endpoint only accepts HTTP GET.
                    type: string
        '429':
          description: 'TooManyRequestsException - Max Per Minute: 600'
          content:
            application/json:
              schema:
                title: TooManyRequestsException
                properties:
                  exception:
                    example: TooManyRequestsException
                    type: string
                  code:
                    example: 429
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: 'TooManyRequestsException - Max Per Minute: 600 (note: daily rate limits may apply, see your subscription plans details)'
                    type: string
        '503':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                title: ServiceUnavailableException
                properties:
                  exception:
                    example: ServiceUnavailableException
                    type: string
                  code:
                    example: 503
                    type: string
                  url:
                    example: /url/path
                    type: string
                  message:
                    example: The server is unavailable, typically only encountered during scheduled maintenance.
                    type: string
      security:
      - bearerAuth: []
components:
  schemas:
    Exception:
      properties:
        exception:
          example: ExceptionName
          type: string
        code:
          example: 500
          type: integer
        url:
          example: /url/path
          type: string
        message:
          example: Internal Error
          type: string
      xml:
        name: response
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
